[project]
name = "lab-02-agent-loop"
version = "0.1.0"
description = "Lab 02: a hand-written agent loop with read-only tools over lab 01's source code"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
